name: Jet
description: 'Jet.com was an American e-commerce company and online marketplace founded in 2014
  by Marc Lore and headquartered in Hoboken, New Jersey. It offered a membership-style shopping
  model with dynamic, real-time pricing that lowered the total as shoppers added items to their
  cart. Walmart acquired Jet.com in 2016 for roughly USD 3.3 billion and folded its operations
  into Walmart''s own e-commerce platform, discontinuing the Jet.com brand in 2020. The jet.com
  domain now redirects to walmart.com; Jet operates no public developer program, API, SDK, or
  documentation. This record is retained as a defunct portfolio lead for network completeness.'
